[project]
name = "path-planning"
version = "0.1.0"
description = "A*, Theta*, RRT, RRT* and friends, compared and benchmarked."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "pillow>=10"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["planning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
